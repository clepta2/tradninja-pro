compatibility_date = "2026-10-01"
workers_dev = true
account_id = "162e1ecd957dc7db1dfbdab4c2bccd23"

[observability]
enabled = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TRADUCOES_KV"
id = "915b4d31e602455a81eeffb0e75902ab"

